<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Snake - 4 jugadores</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#ffffff;

  canvas{display:block;}

  #tensionOverlay{
    position:fixed;inset:0;pointer-events:none;z-index:5;

    transition:opacity 0.2s ease-out;

  #scoreboard{
    position:fixed;top:12px;left:50%;transform:translateX(-50%);
    display:flex;gap:26px;z-index:6;
    padding:8px 22px;border-radius:10px;
    background:rgba(255,255,255,.94);border:1px solid #e3e7ee;

    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;

  .sb-item b{min-width:30px;text-align:right;}

          box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);}

  .lvl-btn[data-score="333"]{border-color:#2f6bff;color:#2f6bff}
  .lvl-btn[data-score="333"]:hover{background:#2f6bff;color:#fff;
    box-shadow:0 6px 16px rgba(47,107,255,.3)}
  .lvl-btn[data-score="333"]:hover small{color:rgba(255,255,255,.85)}
  .lvl-btn[data-score="999"]{border-color:#ff2222;color:#ff2222}
  .lvl-btn[data-score="999"]:hover{background:#ff2222;color:#fff;

  #legend{display:flex;gap:26px;font-size:15px;color:#333;margin-top:14px;
          flex-wrap:wrap;justify-content:center;font-weight:600;letter-spacing:.04em;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #legend span{display:flex;align-items:center;gap:8px}
  .dot{width:12px;height:12px;border-radius:2px;display:inline-block;
       border:1px solid #cfd5df}

  #gameoverOverlay{position:fixed;inset:0;z-index:11;display:none;
                   flex-direction:column;align-items:center;justify-content:center;
                   gap:18px;background:rgba(255,255,255,.97);color:#111;
                   text-align:center;line-height:1.8}
  #gameoverOverlay h1{margin:0;font-size:40px;font-weight:800;letter-spacing:.14em;
                       color:#e000c0}

  #winnerLevel{margin:0;font-size:14px;color:#888;letter-spacing:.12em;
               text-transform:uppercase}

  #gameoverOverlay .countdown{margin:0;font-size:14px;color:#666}
  #gameoverOverlay .countdown b{color:#e000c0;font-weight:700}
</style>

<div id="scoreboard">

<script type="module">
import * as THREE from 'three';

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
const BW = 45;
const BH = 80;
const SCALE = 16;
const WORLD_W = BW * SCALE;
const WORLD_H = BH * SCALE;
const MARGIN_PX = 80;

const STEP_MS       = 160;
const MIN_STEP_MS   = 2;
const SPEED_FACTOR  = 1.1;
const SHRINK_MS     = 80;

const START_LEN     = 4;
const GROW_AMOUNT   = 1;
const FOOD_SIZE     = 1;
const MAX_SEG       = BW * BH;
const RESPAWN_DELAY = 350;
const BFS_EVERY     = 1;

/* --- Comida: 128 → crece +1 neto por comida → tope 256 → reinicia a 1 --- */
const INITIAL_FOODS = 128;
const MAX_FOODS     = 256;
const SPAWN_PER_EAT = 2;
const RESET_TO      = 1;

let WIN_SCORE        = 999;
let currentLevelName = 'EXTENSO';
const GAMEOVER_MS    = 10000;

const NOTE = {
  C3: 130.81, G3: 196.00,
  D4: 293.66, A4: 440.00,
  E4: 329.63, C5: 523.25,
  G5: 783.99, A5: 880.00
};

const SNAKE_CFG = [
  { id:1, name:'NEGRA', color:0x000000, right:NOTE.C3, left:NOTE.G3 },
  { id:2, name:'ROJA',  color:0xff2222, right:NOTE.D4, left:NOTE.A4 },
  { id:3, name:'AZUL',  color:0x2f6bff, right:NOTE.E4, left:NOTE.C5 },
  { id:4, name:'VERDE', color:0x14d44a, right:NOTE.G5, left:NOTE.A5 }
];

const DIRS = [ {x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1} ];

/* =========================================================
   ESTADO
   ========================================================= */
let gameState     = 'menu';
let winnerSnake   = null;
let gameOverStart = 0;
let currentStepMs = STEP_MS;

let shakeUntil     = 0;
let shakeIntensity = 0;

let nextBlurAt    = performance.now() + 5000 + Math.random() * 8000;
let blurTimeoutId = null;
const tensionOverlay = document.getElementById('tensionOverlay');

/* =========================================================
   AUDIO
   ========================================================= */
let actx = null, master = null;

function initAudio(){
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain();
  master.gain.value = 0.55;
  master.connect(actx.destination);
}

function playNote(freq){
  if (!actx || actx.state !== 'running') return;
  const t0   = actx.currentTime;
  const osc  = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, t0);
  const dur = 0.22;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.30, t0 + 0.010);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(master);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

/* =========================================================
   ESCENA
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);

function resize(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  renderer.setSize(vw, vh);

  const availH = Math.max(120, vh - MARGIN_PX * 2);
  const scale  = availH / WORLD_H;
  const viewW  = vw / scale;
  const viewH  = vh / scale;

  camera.left   = -viewW / 2;
  camera.right  =  viewW / 2;
  camera.top    =  viewH / 2;
  camera.bottom = -viewH / 2;
  camera.position.set(WORLD_W / 2, WORLD_H / 2, 500);
  camera.lookAt(WORLD_W / 2, WORLD_H / 2, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const frame = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_W + 4, WORLD_H + 4),
  new THREE.MeshBasicMaterial({ color:0xe3e7ee })
);
frame.position.set(WORLD_W/2, WORLD_H/2, -2);
scene.add(frame);

const field = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_W, WORLD_H),
  new THREE.MeshBasicMaterial({ color:0xffffff })
);
field.position.set(WORLD_W/2, WORLD_H/2, -1);
scene.add(field);

/* =========================================================
   REJILLAS
   ========================================================= */
const grid     = new Uint8Array(BW * BH);
const foodGrid = new Uint8Array(BW * BH);
const idx = (x,y) => y * BW + x;
const inBounds = (x,y) => x >= 0 && x < BW && y >= 0 && y < BH;
const cellFree = (x,y) => inBounds(x,y) && grid[idx(x,y)] === 0;
const cellFreeForFood = (x,y) =>
  cellFree(x,y) && foodGrid[idx(x,y)] === 0;

/* =========================================================
   COMIDA
   ========================================================= */
const foods = [];
const foodGeo = new THREE.PlaneGeometry(FOOD_SIZE * SCALE, FOOD_SIZE * SCALE);

function relocateFood(f){
  if (f.x >= 0 && f.x < BW && f.y >= 0 && f.y < BH){
    foodGrid[idx(f.x, f.y)] = 0;
  }
  for (let i = 0; i < 500; i++){
    const x = 2 + Math.floor(Math.random() * (BW - 4));
    const y = 2 + Math.floor(Math.random() * (BH - 4));
    if (cellFreeForFood(x, y)){
      f.x = x; f.y = y;
      f.mesh.position.set((x + 0.5) * SCALE, (y + 0.5) * SCALE, 1);
      foodGrid[idx(x, y)] = 1;
      return true;
    }
  }
  return false;
}

function spawnFood(){
  const mat = new THREE.MeshBasicMaterial({
    color: 0xff00ff, transparent:true, opacity:1, depthWrite:false
  });
  const mesh = new THREE.Mesh(foodGeo, mat);
  const f = { x:-1, y:-1, mesh, phase: Math.random() * Math.PI * 2 };
  if (!relocateFood(f)){
    mat.dispose();
    return null;
  }
  scene.add(mesh);
  foods.push(f);
  return f;
}

function createFoods(){
  for (let i = 0; i < INITIAL_FOODS; i++) spawnFood();
}

function foodAt(x, y){
  for (const f of foods){
    if (f.x === x && f.y === y) return f;
  }
  return null;
}

function onFoodEaten(f){
  // Quitar el píxel comido
  const i = foods.indexOf(f);
  if (i >= 0) foods.splice(i, 1);
  scene.remove(f.mesh);
  f.mesh.material.dispose();
  if (f.x >= 0 && f.x < BW && f.y >= 0 && f.y < BH){
    foodGrid[idx(f.x, f.y)] = 0;
  }

  if (gameState === 'winner'){
    /* --- MODO GANADOR: duplicar sin tope (limitado por el tablero) --- */
    const n = foods.length;
    for (let k = 0; k < n; k++){
      if (!spawnFood()) break;
    }
  } else {
    /* --- MODO NORMAL: +2 por comer (-1 consumido = +1 neto) --- */
    for (let k = 0; k < SPAWN_PER_EAT; k++) spawnFood();

    // ✅ Regla restaurada: al llegar al tope → reiniciar a 1 píxel
    if (foods.length >= MAX_FOODS){
      while (foods.length > RESET_TO){
        const r = foods.pop();
        scene.remove(r.mesh);
        r.mesh.material.dispose();
        if (r.x >= 0 && r.x < BW && r.y >= 0 && r.y < BH){
          foodGrid[idx(r.x, r.y)] = 0;
        }
      }
      if (foods.length === 0) spawnFood();
      else relocateFood(foods[0]);
    }
  }
}

/* =========================================================
   BFS
   ========================================================= */
const distField = new Int32Array(BW * BH);
const bfsQueue  = new Int32Array(BW * BH);

function computeDistField(){
  distField.fill(-1);
  let qh = 0, qt = 0;

  for (const f of foods){
    if (!inBounds(f.x, f.y)) continue;
    const c = f.y * BW + f.x;
    if (grid[c] !== 0) continue;
    if (distField[c] === -1){
      distField[c] = 0;
      bfsQueue[qt++] = c;
    }
  }

  while (qh < qt){
    const c = bfsQueue[qh++];
    const cx = c % BW;
    const cy = (c - cx) / BW;
    const nd = distField[c] + 1;

    if (cx > 0){
      const nc = c - 1;
      if (grid[nc] === 0 && distField[nc] === -1){ distField[nc] = nd; bfsQueue[qt++] = nc; }
    }
    if (cx < BW - 1){
      const nc = c + 1;
      if (grid[nc] === 0 && distField[nc] === -1){ distField[nc] = nd; bfsQueue[qt++] = nc; }
    }
    if (cy > 0){
      const nc = c - BW;
      if (grid[nc] === 0 && distField[nc] === -1){ distField[nc] = nd; bfsQueue[qt++] = nc; }
    }
    if (cy < BH - 1){
      const nc = c + BW;
      if (grid[nc] === 0 && distField[nc] === -1){ distField[nc] = nd; bfsQueue[qt++] = nc; }
    }
  }
}

/* =========================================================
   EFECTOS VISUALES DE COLISIÓN
   ========================================================= */
const RING_GEO     = new THREE.RingGeometry(SCALE * 0.35, SCALE * 0.75, 32);
const PARTICLE_GEO = new THREE.PlaneGeometry(SCALE * 0.55, SCALE * 0.55);
const FLASH_GEO    = new THREE.PlaneGeometry(SCALE * 3, SCALE * 3);

const effects = [];

function spawnCollisionEffect(gx, gy, color, intensity = 1){
  gx = Math.max(0, Math.min(BW - 1, gx));
  gy = Math.max(0, Math.min(BH - 1, gy));

  const wx = (gx + 0.5) * SCALE;
  const wy = (gy + 0.5) * SCALE;

  const ringMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.9, depthWrite: false,
    side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(RING_GEO, ringMat);
  ring.position.set(wx, wy, 3);
  ring.scale.set(intensity, intensity, 1);
  scene.add(ring);
  effects.push({
    mesh: ring, kind: 'ring', life: 0,
    maxLife: 480 + 120 * intensity,
    baseScale: intensity,
    finalScale: (4 + intensity) * intensity
  });

  const N = Math.floor(14 * intensity);
  for (let i = 0; i < N; i++){
    const pMat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 1, depthWrite: false
    });
    const p = new THREE.Mesh(PARTICLE_GEO, pMat);
    p.position.set(wx, wy, 3);
    p.scale.set(intensity, intensity, 1);
    scene.add(p);

    const angle = (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
    const speed = (8 + Math.random() * 14) * intensity;
    effects.push({
      mesh: p, kind: 'particle', life: 0,
      maxLife: 380 + Math.random() * 260,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      baseScale: intensity
    });
  }

  const flashMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.85, depthWrite: false
  });
  const flash = new THREE.Mesh(FLASH_GEO, flashMat);
  flash.position.set(wx, wy, 4);
  flash.scale.set(intensity, intensity, 1);
  scene.add(flash);
  effects.push({
    mesh: flash, kind: 'flash', life: 0,
    maxLife: 180,
    baseScale: intensity
  });

  shakeUntil     = performance.now() + 320 * intensity;
  shakeIntensity = Math.min(1.4, 0.7 * intensity);
}

function updateEffects(dt){
  for (let i = effects.length - 1; i >= 0; i--){
    const e = effects[i];
    e.life += dt;
    const t = e.life / e.maxLife;

    if (t >= 1){
      scene.remove(e.mesh);
      e.mesh.material.dispose();
      effects.splice(i, 1);
      continue;
    }

    if (e.kind === 'ring'){
      const s = e.baseScale + (e.finalScale - e.baseScale) * t;
      e.mesh.scale.set(s, s, 1);
      e.mesh.material.opacity = 0.9 * (1 - t);
    }
    else if (e.kind === 'particle'){
      const damp = 1 - t;
      e.mesh.position.x += e.vx * (dt / 16) * damp;
      e.mesh.position.y += e.vy * (dt / 16) * damp;
      e.mesh.material.opacity = 1 - t * t;
      const s = e.baseScale * (1 - t * 0.55);
      e.mesh.scale.set(s, s, 1);
    }
    else if (e.kind === 'flash'){
      e.mesh.material.opacity = 0.85 * (1 - t);
      const s = e.baseScale * (1 + t * 1.6);
      e.mesh.scale.set(s, s, 1);
    }
  }
}

function clearEffects(){
  for (const e of effects){
    scene.remove(e.mesh);
    e.mesh.material.dispose();
  }
  effects.length = 0;
}

/* =========================================================
   BLUR ALEATORIO
   ========================================================= */
function triggerBlur(amount, duration){
  const c = renderer.domElement;
  if (blurTimeoutId) clearTimeout(blurTimeoutId);

  c.style.transition = 'filter 0.15s ease-out';
  c.style.filter = `blur(${amount.toFixed(1)}px)`;

  tensionOverlay.style.transition = 'opacity 0.2s ease-out';
  tensionOverlay.style.opacity = '1';

  blurTimeoutId = setTimeout(() => {
    c.style.transition = `filter ${duration}ms ease-in`;
    c.style.filter = '';

    tensionOverlay.style.transition = `opacity ${duration}ms ease-in`;
    tensionOverlay.style.opacity = '0';

    blurTimeoutId = null;
  }, 150);
}

/* =========================================================
   CLASE CULEBRA
   ========================================================= */
const segGeo = new THREE.PlaneGeometry(SCALE, SCALE);

class Snake {
  constructor(cfg){
    this.id        = cfg.id;
    this.name      = cfg.name;
    this.color     = cfg.color;
    this.rightFreq = cfg.right;
    this.leftFreq  = cfg.left;

    this.score = 0;

    const mat = new THREE.MeshBasicMaterial({ color: cfg.color });
    this.mesh = new THREE.InstancedMesh(segGeo, mat, MAX_SEG);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    this.mesh.count = 0;
    scene.add(this.mesh);

    this.cells       = [];
    this.dir         = { x:1, y:0 };
    this.pendingGrow = 0;
    this.state       = 'respawning';
    this.deathTimer  = 0;
    this.crashPos    = null;
    this._m          = new THREE.Matrix4();

    this.spawn();
  }

  spawn(){
    for (const c of this.cells){
      if (inBounds(c.x, c.y)) grid[idx(c.x, c.y)] = 0;
    }
    this.cells.length = 0;

    if (this.crashPos){
      const cp = this.crashPos;

      let bodyFits = true;
      for (let i = 0; i < START_LEN; i++){
        const x = cp.x - cp.dir.x * i;
        const y = cp.y - cp.dir.y * i;
        if (!inBounds(x, y) || grid[idx(x, y)] !== 0 || foodGrid[idx(x, y)] !== 0){
          bodyFits = false; break;
        }
      }

      let forwardDir = null;
      const candidates = [cp.dir];
      for (const d of DIRS){
        if (d.x !== -cp.dir.x || d.y !== -cp.dir.y) candidates.push(d);
      }
      for (const d of candidates){
        const nx = cp.x + d.x;
        const ny = cp.y + d.y;
        if (inBounds(nx, ny) && grid[idx(nx, ny)] === 0){
          forwardDir = d; break;
        }
      }

      if (bodyFits && forwardDir){
        this.dir = { x: forwardDir.x, y: forwardDir.y };
        for (let i = 0; i < START_LEN; i++){
          const x = cp.x - cp.dir.x * i;
          const y = cp.y - cp.dir.y * i;
          this.cells.push({ x, y });
          grid[idx(x, y)] = this.id;
        }
        this.pendingGrow = 0;
        this.state       = 'alive';
        this.crashPos    = null;
        return;
      }
    }

    let hx = BW/2, hy = BH/2, dx = 0, dy = 1;

    for (let t = 0; t < 800; t++){
      hx = 4 + Math.floor(Math.random() * (BW - 8));
      hy = 4 + Math.floor(Math.random() * (BH - 8));
      const pick = DIRS[Math.floor(Math.random() * 4)];
      dx = pick.x; dy = pick.y;

      let ok = true;
      for (let i = 0; i < START_LEN + 6; i++){
        const cx = hx - dx*i, cy = hy - dy*i;
        if (!inBounds(cx, cy)) { ok = false; break; }
        if (grid[idx(cx, cy)] !== 0) { ok = false; break; }
        if (foodGrid[idx(cx, cy)] !== 0) { ok = false; break; }
      }
      if (ok) break;
    }

    this.dir = { x:dx, y:dy };

    for (let i = 0; i < START_LEN; i++){
      const x = hx - dx*i, y = hy - dy*i;
      if (!inBounds(x, y)) break;
      this.cells.push({ x, y });
      grid[idx(x, y)] = this.id;
    }

    this.pendingGrow = 0;
    this.state       = 'alive';
  }

  decide(){
    const head = this.cells[0];
    if (!head) return;

    let bestDir  = null;
    let bestDist = Infinity;

    for (const d of DIRS){
      const nx = head.x + d.x;
      const ny = head.y + d.y;
      if (!inBounds(nx, ny)) continue;
      const nc = ny * BW + nx;
      if (grid[nc] !== 0) continue;
      const dd = distField[nc];
      if (dd < 0) continue;

      const isCur = (d.x === this.dir.x && d.y === this.dir.y);
      if (dd < bestDist || (dd === bestDist && isCur)){
        bestDist = dd;
        bestDir  = d;
      }
    }

    if (!bestDir){
      if (cellFree(head.x + this.dir.x, head.y + this.dir.y)){
        bestDir = this.dir;
      } else {
        for (const d of DIRS){
          if (cellFree(head.x + d.x, head.y + d.y)){ bestDir = d; break; }
        }
      }
    }

    if (!bestDir) return;

    if (bestDir.x !== this.dir.x || bestDir.y !== this.dir.y){
      this.turnTo(bestDir);
    }
  }

  turnTo(d){
    const cross = this.dir.x * d.y - this.dir.y * d.x;
    if (cross < 0)      playNote(this.rightFreq);
    else if (cross > 0) playNote(this.leftFreq);
    this.dir = { x:d.x, y:d.y };
  }

  advance(){
    const head = this.cells[0];
    const nx = head.x + this.dir.x;
    const ny = head.y + this.dir.y;

    if (!inBounds(nx, ny) || grid[idx(nx, ny)] !== 0){
      this.die(nx, ny);
      return;
    }

    this.cells.unshift({ x:nx, y:ny });
    grid[idx(nx, ny)] = this.id;

    const f = foodAt(nx, ny);
    if (f){
      this.score++;

      if (gameState === 'winner'){
        this.pendingGrow += GROW_AMOUNT;
      } else {
        this.pendingGrow = Math.min(this.pendingGrow + GROW_AMOUNT, 100);
      }

      if (gameState === 'playing' && this.score >= WIN_SCORE){
        activateWinnerMode(this);
      }

      onFoodEaten(f);
    }

    if (this.pendingGrow > 0 && this.cells.length < MAX_SEG){
      this.pendingGrow--;
    } else {
      const t = this.cells.pop();
      grid[idx(t.x, t.y)] = 0;
    }
  }

  die(collX, collY){
    if (this.state !== 'alive') return;
    this.state = 'dying';

    const head = this.cells[0];
    if (head){
      this.crashPos = {
        x: head.x, y: head.y,
        dir: { x: this.dir.x, y: this.dir.y }
      };
    }

    const ex = collX !== undefined ? collX : (head ? head.x + this.dir.x : 0);
    const ey = collY !== undefined ? collY : (head ? head.y + this.dir.y : 0);
    const intensity = (this === winnerSnake) ? 2.2 : 1;
    spawnCollisionEffect(ex, ey, this.color, intensity);

    triggerBlur(2 + Math.random() * 2, 350);

    if (gameState === 'winner' && this === winnerSnake){
      gameState = 'gameover';
      gameOverStart = performance.now();
      showGameOver();
    }
  }

  shrink(){
    if (this.state !== 'dying') return;

    const n = Math.max(1, Math.ceil(this.cells.length / 8));

    for (let i = 0; i < n; i++){
      if (this.cells.length > 1){
        const t = this.cells.pop();
        grid[idx(t.x, t.y)] = 0;
      } else {
        if (this.cells.length === 1){
          const t = this.cells[0];
          grid[idx(t.x, t.y)] = 0;
          this.cells.pop();
        }
        this.state = (gameState === 'gameover') ? 'gone' : 'respawning';
        this.deathTimer = 0;
        return;
      }
    }
  }

  updateMesh(){
    const n = Math.min(this.cells.length, MAX_SEG);
    const m = this._m;
    for (let i = 0; i < n; i++){
      const c = this.cells[i];
      m.makeTranslation((c.x + 0.5) * SCALE, (c.y + 0.5) * SCALE, 0);
      this.mesh.setMatrixAt(i, m);
    }
    this.mesh.count = n;
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}

/* =========================================================
   INICIALIZACIÓN + RESET
   ========================================================= */
let snakes = [];

function buildGame(){
  createFoods();
  snakes = SNAKE_CFG.map(cfg => new Snake(cfg));
  updateScoreboard();
}

function resetGame(){
  gameoverOverlay.style.display = 'none';

  for (const s of snakes){
    scene.remove(s.mesh);
    s.mesh.material.dispose();
  }
  snakes = [];

  for (const f of foods){
    scene.remove(f.mesh);
    f.mesh.material.dispose();
  }
  foods.length = 0;

  clearEffects();

  grid.fill(0);
  foodGrid.fill(0);

  buildGame();

  gameState     = 'menu';
  winnerSnake   = null;
  currentStepMs = STEP_MS;
  moveAcc       = 0;
  shrinkAcc     = 0;
  stepCount     = 0;
  lastT         = performance.now();

  renderer.domElement.style.filter = '';
  renderer.domElement.style.transform = '';
  tensionOverlay.style.opacity = '0';
  if (blurTimeoutId){ clearTimeout(blurTimeoutId); blurTimeoutId = null; }
  nextBlurAt = performance.now() + 5000 + Math.random() * 8000;
  shakeUntil = 0;

  overlay.style.display = 'flex';
}

/* =========================================================
   MODO GANADOR
   ========================================================= */
function activateWinnerMode(snake){
  gameState   = 'winner';
  winnerSnake = snake;

  currentStepMs = Math.max(MIN_STEP_MS, currentStepMs / SPEED_FACTOR);

  for (const s of snakes){
    if (s === snake) continue;
    for (const c of s.cells){
      if (inBounds(c.x, c.y)) grid[idx(c.x, c.y)] = 0;
    }
    s.cells.length = 0;
    s.state = 'gone';
  }

  triggerBlur(6, 900);
}

/* =========================================================
   GAME OVER
   ========================================================= */
const gameoverOverlay = document.getElementById('gameoverOverlay');
const winnerTextEl    = document.getElementById('winnerText');
const winnerLevelEl   = document.getElementById('winnerLevel');
const winnerScoreEl   = document.getElementById('winnerScore');
const countdownEl     = document.getElementById('countdown');

function showGameOver(){
  const hex = '#' + winnerSnake.color.toString(16).padStart(6, '0');
  winnerTextEl.textContent  = `LA CULEBRA ${winnerSnake.name} GANA`;
  winnerTextEl.style.color  = hex;
  winnerLevelEl.textContent = `NIVEL ${currentLevelName}`;
  winnerScoreEl.textContent = `Puntuación final: ${winnerSnake.score}  ·  Longitud: ${winnerSnake.cells.length}`;
  countdownEl.textContent   = '10';
  gameoverOverlay.style.display = 'flex';
}

/* =========================================================
   MARCADOR
   ========================================================= */
const scoreEls = [
  document.getElementById('sc1'),
  document.getElementById('sc2'),
  document.getElementById('sc3'),
  document.getElementById('sc4')
];

function updateScoreboard(){
  for (let i = 0; i < snakes.length; i++){
    scoreEls[i].textContent = snakes[i].score;
  }
}

/* =========================================================
   ARRANQUE
   ========================================================= */
buildGame();

/* =========================================================
   MENÚ DE NIVELES
   ========================================================= */
const overlay = document.getElementById('overlay');
const levelBtns = document.querySelectorAll('.lvl-btn');

levelBtns.forEach(btn => {
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (gameState !== 'menu') return;

    WIN_SCORE        = parseInt(btn.dataset.score, 10);
    currentLevelName = btn.childNodes[0].textContent.trim();

    initAudio();
    if (actx.state === 'suspended') await actx.resume();

    overlay.style.display = 'none';
    gameState = 'playing';
    currentStepMs = STEP_MS;
    lastT = performance.now();
    nextBlurAt = performance.now() + 4000 + Math.random() * 6000;
  });
});

/* =========================================================
   BUCLE
   ========================================================= */
let lastT     = performance.now();
let moveAcc   = 0;
let shrinkAcc = 0;
let stepCount = 0;

function loop(now){
  requestAnimationFrame(loop);

  const dt = Math.min(now - lastT, 100);
  lastT = now;
  const tsec = now / 1000;

  if (gameState === 'playing' || gameState === 'winner'){
    moveAcc += dt;
    let guard = 0;
    while (moveAcc >= currentStepMs && guard++ < 64){
      moveAcc -= currentStepMs;

      if (stepCount % BFS_EVERY === 0) computeDistField();
      stepCount++;

      for (const s of snakes){
        if (s.state === 'alive'){ s.decide(); s.advance(); }
      }
    }
    if (guard >= 64) moveAcc = 0;
  }

  if (gameState === 'playing' || gameState === 'winner' || gameState === 'gameover'){
    shrinkAcc += dt;
    let guard = 0;
    while (shrinkAcc >= SHRINK_MS && guard++ < 8){
      shrinkAcc -= SHRINK_MS;
      for (const s of snakes) s.shrink();
    }
    if (guard >= 8) shrinkAcc = 0;
  }

  if (gameState !== 'gameover'){
    for (const s of snakes){
      if (s.state === 'respawning'){
        s.deathTimer += dt;
        if (s.deathTimer >= RESPAWN_DELAY) s.spawn();
      }
    }
  }

  if (gameState === 'gameover'){
    const elapsed = now - gameOverStart;
    const remaining = Math.max(0, Math.ceil((GAMEOVER_MS - elapsed) / 1000));
    if (countdownEl.textContent !== String(remaining)){
      countdownEl.textContent = remaining;
    }
    if (elapsed >= GAMEOVER_MS){
      resetGame();
    }
  }

  if ((gameState === 'playing' || gameState === 'winner') && now >= nextBlurAt){
    const amount   = 2 + Math.random() * 4;
    const duration = 500 + Math.random() * 900;
    triggerBlur(amount, duration);

    const cooldown = (gameState === 'winner') ? 1800 : 4500;
    nextBlurAt = now + duration + cooldown + Math.random() * 6000;
  }

  if (now < shakeUntil){
    const k  = (shakeUntil - now) / 350;
    const dx = (Math.random() - 0.5) * shakeIntensity * 22 * k;
    const dy = (Math.random() - 0.5) * shakeIntensity * 22 * k;
    renderer.domElement.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
  } else if (renderer.domElement.style.transform){
    renderer.domElement.style.transform = '';
  }

  updateEffects(dt);

  for (const f of foods){
    const p = 0.5 + 0.5 * Math.sin(tsec * 7 + f.phase);
    f.mesh.material.opacity = 0.20 + 0.80 * p;
    const sc = 0.75 + 0.45 * p;
    f.mesh.scale.set(sc, sc, 1);
  }

  for (const s of snakes) s.updateMesh();
  if (gameState === 'playing' || gameState === 'winner') updateScoreboard();

  renderer.render(scene, camera);
}

requestAnimationFrame(loop);
</script>
